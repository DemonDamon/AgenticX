name: Enterprise container images

on:
  push:
    branches: [main, master]
    paths:
      - "enterprise/apps/gateway/**"
      - "enterprise/apps/web-portal/**"
      - "enterprise/apps/admin-console/**"
      - "enterprise/apps/agent-runtime/**"
      - "enterprise/apps/Dockerfile.next"
      - "enterprise/packages/**"
      - "enterprise/features/**"
      - "enterprise/plugins/**"
      - "enterprise/package.json"
      - "enterprise/pnpm-workspace.yaml"
      - "enterprise/turbo.json"
      - "enterprise/tsconfig.base.json"
      - "connector-runtime/**"
      - "agenticx/**"
      - "pyproject.toml"
      - ".github/workflows/enterprise-images.yml"
  release:
    types: [published]
  pull_request:
    paths:
      - "enterprise/apps/gateway/Dockerfile"
      - "enterprise/apps/gateway/Dockerfile.dockerignore"
      - "enterprise/apps/Dockerfile.next"
      - "enterprise/apps/agent-runtime/Dockerfile"
      - "enterprise/apps/agent-runtime/Dockerfile.dockerignore"
      - ".github/workflows/enterprise-images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra tag to publish (e.g. v0.6.6 or rc-1)"
        required: false
        default: ""
        type: string
      push:
        description: "Push images to GHCR (false = build-only dry run)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: enterprise-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: enterprise-gateway
            context: .
            file: enterprise/apps/gateway/Dockerfile
            build_args: ""
          - image: enterprise-web-portal
            context: enterprise
            file: enterprise/apps/Dockerfile.next
            build_args: |
              APP_NAME=web-portal
              APP_PACKAGE=@agenticx/app-web-portal
              APP_PORT=3000
          - image: enterprise-admin-console
            context: enterprise
            file: enterprise/apps/Dockerfile.next
            build_args: |
              APP_NAME=admin-console
              APP_PACKAGE=@agenticx/app-admin-console
              APP_PORT=3001
          - image: enterprise-agent-runtime
            context: .
            file: enterprise/apps/agent-runtime/Dockerfile
            build_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Determine whether to push
        id: publish_policy
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push }}" != "true" ]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize image repository name
        id: repo
        shell: bash
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner_lc}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.publish_policy.outputs.should_push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},prefix=enterprise-v
            type=semver,pattern={{major}}.{{minor}},prefix=enterprise-v
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'master') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ steps.publish_policy.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
