name: Gateway Reservation Storage

on:
  pull_request:
    paths:
      - "enterprise/apps/gateway/**"
      - ".github/workflows/gateway-reservation-storage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-reservation-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  receipt-storage:
    name: Reservation persistence (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgresql, mysql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: agx_quota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agx_quota_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agx_quota_test
          MYSQL_USER: agenticx
          MYSQL_PASSWORD: agenticx
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: enterprise/apps/gateway/go.mod
          cache-dependency-path: enterprise/apps/gateway/go.sum
      - name: Run receipt contracts with race detection
        working-directory: enterprise/apps/gateway
        run: go test -count=1 -race ./internal/quota ./internal/billing ./internal/server
      - name: Run real reservation persistence contracts
        working-directory: enterprise/apps/gateway
        env:
          DATABASE_DIALECT: ${{ matrix.dialect }}
          DATABASE_URL: ${{ matrix.dialect == 'postgresql' && 'postgresql://postgres:postgres@127.0.0.1:5432/agx_quota_test' || 'mysql://agenticx:agenticx@127.0.0.1:3306/agx_quota_test' }}
          GATEWAY_QUOTA_TEST_DIALECT: ${{ matrix.dialect }}
          GATEWAY_QUOTA_TEST_DATABASE_URL: ${{ matrix.dialect == 'postgresql' && 'postgresql://postgres:postgres@127.0.0.1:5432/agx_quota_test' || 'mysql://agenticx:agenticx@127.0.0.1:3306/agx_quota_test' }}
        run: |
          test -n "$GATEWAY_QUOTA_TEST_DATABASE_URL"
          go test -count=1 -race -json ./internal/quota -run '^(TestReservationRealDatabase|TestBudgetDatabaseURLReceiptLifecycle)$' | tee receipt-result.jsonl
          python3 - <<'PY_GATE'
          import json
          events = [json.loads(line) for line in open("receipt-result.jsonl")]
          for name in ("TestReservationRealDatabase", "TestBudgetDatabaseURLReceiptLifecycle"):
              selected = [e for e in events if e.get("Test") == name]
              assert any(e.get("Action") == "pass" for e in selected), f"{name} did not pass"
              assert not any(e.get("Action") == "skip" for e in selected), f"{name} skipped"
          PY_GATE
