version: 2
updates:
  # Python 主仓（agenticx 核心包）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # npm：desktop（Electron 桌面端，大头，独立限制）
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # 强耦合栈必须同 PR 升，避免半升级（如只升 react-dom 不升 react）
      react-stack:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["major", "minor", "patch"]
      vite-stack:
        patterns: ["vite", "@vitejs/plugin-react"]
        update-types: ["major", "minor", "patch"]
      i18n-stack:
        patterns: ["i18next", "react-i18next"]
        update-types: ["major", "minor", "patch"]
    ignore:
      # @types/node 大版本须与 Electron 内置 Node 对齐后手动升，不自动开 PR
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # npm：mobile
  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # Expo SDK 升级必须整族同 PR，避免单个 expo-* 包与 expo 本体版本错位
      expo-stack:
        patterns: ["expo", "expo-*"]
        update-types: ["major", "minor", "patch"]

  # npm：enterprise workspace（pnpm-lock，web-portal / admin-console 等）
  - package-ecosystem: npm
    directory: "/enterprise"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Go：主仓活跃模块（customers/、.paper-aamas/、research/ 副本不配置）
  - package-ecosystem: gomod
    directory: "/enterprise/apps/gateway"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gomod-x-deps:
        patterns: ["golang.org/x/*"]
  - package-ecosystem: gomod
    directory: "/enterprise/apps/edge-agent"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gomod-x-deps:
        patterns: ["golang.org/x/*"]
  - package-ecosystem: gomod
    directory: "/enterprise/packages/policy-engine"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: "/connector-runtime"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: "/packaging/wechat-sidecar"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directory: "/enterprise/scripts/perf/mock-upstream"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directory: "/enterprise/scripts/perf/mint-perf-jwt"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # GitHub Actions（CI workflow 用的 action 版本）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
