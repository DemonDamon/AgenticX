# nginx LB for the HA validation stack.
#
# Sticky strategy: hash by ?session_id= when present, else by client address.
# NOTE: /api/chat carries session_id in the POST body (not the query string),
# so a chat request may land on a replica that does not hold the session lock;
# it then receives `session_busy_elsewhere` and the client/LB should retry the
# other replica. This is a documented limitation of body-based routing.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $arg_session_id $sticky_key {
        default $remote_addr;
        ~.+ $arg_session_id;
    }

    upstream agx_backend {
        hash $sticky_key;
        server agx-a:8000;
        server agx-b:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://agx_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # SSE: disable buffering and allow long-lived streams.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
