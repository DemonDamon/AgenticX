worker_processes auto;
events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # 基础限流（公网入口第一道保护）
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;

  upstream gateway_backend {
    least_conn;
    server gateway-a:8088 max_fails=3 fail_timeout=10s;
    server gateway-b:8088 max_fails=3 fail_timeout=10s;
  }

  upstream web_portal_backend {
    server web-portal:3000;
  }

  upstream admin_console_backend {
    server admin-console:3001;
  }

  server {
    listen 80;
    server_name _;

    # 生产建议开启 TLS；此处保留 HTTP 入口用于内网/反向代理上游接入。
    location /healthz {
      proxy_pass http://gateway_backend/healthz;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
      limit_req zone=api_limit burst=60 nodelay;
      limit_conn api_conn 40;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_pass http://gateway_backend;
    }

    # portal BFF 独有：deep-research / web-search 编排 + 聊天历史。
    # gateway 只暴露 /v1/*，此处必须指向 web-portal，否则历史同步 404/连接重置，
    # 浏览器侧表现为 Failed to fetch。
    location /api/chat/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # SSE：禁用缓冲与缓存，否则事件被 nginx 攒着不下发。
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;

      # 与 orchestrator TOTAL_BUDGET_MS 对齐，留足余量。
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;

      proxy_pass http://web_portal_backend;
    }

    # Managed Agents 公共 API：控制面资源 -> admin-console /api/ma/v1/*；会话面 / Worker -> agent-runtime。
    # agent-runtime 用变量 + resolver 寻址：未部署该容器时 nginx 仍能启动，只有 /ma/v1 会话面返回 502。
    resolver 127.0.0.11 valid=30s ipv6=off;

    # environments 下的 Worker 长轮询属于会话面，必须写在控制面正则之前（正则 location 按出现顺序匹配）。
    location ~ ^/ma/v1/environments/[^/]+/work/ {
      set $ma_runtime_upstream http://agent-runtime:8092;
      limit_req zone=api_limit burst=60 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_pass $ma_runtime_upstream;
    }

    location ~ ^/ma/v1/(agents|environments|vaults|memory_stores|schedules|channels|webhooks)(/|$) {
      limit_req zone=api_limit burst=40 nodelay;
      rewrite ^/ma/v1/(.*)$ /api/ma/v1/$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://admin_console_backend;
    }

    location /ma/v1/ {
      set $ma_runtime_upstream http://agent-runtime:8092;
      limit_req zone=api_limit burst=60 nodelay;
      client_max_body_size 20m;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # SSE：禁用缓冲，长连接保持 1 小时（服务端每 15 秒 ping）。
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass $ma_runtime_upstream;
    }

    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://admin_console_backend/;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://web_portal_backend/;
    }
  }
}
