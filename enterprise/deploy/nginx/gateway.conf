worker_processes auto;
events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # 基础限流（公网入口第一道保护）
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;

  # 外层 HTTPS 代理终止 TLS 后通过这些 header 保留公网 origin；
  # 未经过外层代理时回退到当前 HTTP 连接，兼容本地调试。
  map $http_x_forwarded_proto $agx_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
  }

  map $http_x_forwarded_host $agx_forwarded_host {
    default $host;
    "" $host;
  }

  upstream gateway_backend {
    least_conn;
    server gateway-a:8088 max_fails=3 fail_timeout=10s;
    server gateway-b:8088 max_fails=3 fail_timeout=10s;
  }

  upstream web_portal_backend {
    server web-portal:3000;
  }

  upstream admin_console_backend {
    server admin-console:3001;
  }

  server {
    listen 80;
    server_name _;

    # 生产建议开启 TLS；此处保留 HTTP 入口用于内网/反向代理上游接入。
    location /healthz {
      proxy_pass http://gateway_backend/healthz;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $agx_forwarded_host;
      proxy_set_header X-Forwarded-Proto $agx_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
      limit_req zone=api_limit burst=60 nodelay;
      limit_conn api_conn 40;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $agx_forwarded_host;
      proxy_set_header X-Forwarded-Proto $agx_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_pass http://gateway_backend;
    }

    # portal BFF 独有：deep-research / web-search 编排 + 聊天历史。
    # gateway 只暴露 /v1/*，此处必须指向 web-portal，否则历史同步 404/连接重置，
    # 浏览器侧表现为 Failed to fetch。
    location /api/chat/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $agx_forwarded_host;
      proxy_set_header X-Forwarded-Proto $agx_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # SSE：禁用缓冲与缓存，否则事件被 nginx 攒着不下发。
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;

      # 与 orchestrator TOTAL_BUDGET_MS 对齐，留足余量。
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;

      proxy_pass http://web_portal_backend;
    }

    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $agx_forwarded_host;
      proxy_set_header X-Forwarded-Proto $agx_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://admin_console_backend/;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $agx_forwarded_host;
      proxy_set_header X-Forwarded-Proto $agx_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://web_portal_backend/;
    }
  }
}
