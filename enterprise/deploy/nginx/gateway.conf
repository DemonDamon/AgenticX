worker_processes auto;
events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # 基础限流（公网入口第一道保护）
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;

  upstream gateway_backend {
    least_conn;
    server gateway-a:8088 max_fails=3 fail_timeout=10s;
    server gateway-b:8088 max_fails=3 fail_timeout=10s;
  }

  upstream web_portal_backend {
    server web-portal:3000;
  }

  upstream admin_console_backend {
    server admin-console:3001;
  }

  # Portal + Gateway + Managed Agents 入口（HTTP :80）
  # 生产公网部署建议改用 gateway.tls.conf 开启 TLS（443 + 8443），详见 nginx/certs/README.md。
  server {
    listen 80;
    server_name _;

    include /etc/nginx/includes/portal-locations.conf;
  }

  # Admin Console 独立端口入口（HTTP :8081）
  # 避免与 web-portal 同源挂载在 /admin/ 下导致 Next.js /_next/* 静态资源冲突。
  # 如需独立子域部署，可改为 `listen 80; server_name admin.example.com;`。
  server {
    listen 8081;
    server_name _;

    include /etc/nginx/includes/admin-locations.conf;
  }
}
