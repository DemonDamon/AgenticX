worker_processes auto;
events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # TLS 安全基线（需提前将 fullchain.pem / privkey.pem 放入 enterprise/deploy/nginx/certs/）
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # 基础限流（公网入口第一道保护）
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;

  upstream gateway_backend {
    least_conn;
    server gateway-a:8088 max_fails=3 fail_timeout=10s;
    server gateway-b:8088 max_fails=3 fail_timeout=10s;
  }

  upstream web_portal_backend {
    server web-portal:3000;
  }

  upstream admin_console_backend {
    server admin-console:3001;
  }

  # HTTP :80 保留 /healthz 探针，其余强制跳转 HTTPS :443
  server {
    listen 80;
    server_name _;

    location = /healthz {
      proxy_pass http://gateway_backend/healthz;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Portal + Gateway + Managed Agents 入口（HTTPS :443）
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/includes/portal-locations.conf;
  }

  # Admin Console HTTP :8081 自动跳转至 HTTPS :8443
  server {
    listen 8081;
    server_name _;

    location / {
      return 301 https://$host:8443$request_uri;
    }
  }

  # Admin Console 独立端口入口（HTTPS :8443）
  # 如需独立子域（如 admin.example.com:443），可改为 `listen 443 ssl; http2 on; server_name admin.example.com;`
  # 并对应挂载管理后台证书。
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/includes/admin-locations.conf;
  }
}
