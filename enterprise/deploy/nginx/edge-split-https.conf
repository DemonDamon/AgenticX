worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Raise header buffers to absorb larger auth cookies/JWT Set-Cookie responses.
  large_client_header_buffers 4 16k;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;

  upstream agenticx_gateway {
    least_conn;
    server 192.168.16.66:8088 max_fails=3 fail_timeout=10s;
    server 192.168.16.67:8088 max_fails=3 fail_timeout=10s;
  }

  upstream agenticx_portal {
    least_conn;
    server 192.168.16.68:3000 max_fails=3 fail_timeout=10s;
    server 192.168.16.69:3000 max_fails=3 fail_timeout=10s;
  }

  upstream agenticx_admin {
    least_conn;
    server 192.168.16.70:3001 max_fails=3 fail_timeout=10s;
    server 192.168.16.71:3001 max_fails=3 fail_timeout=10s;
  }

  # External HTTP: redirect to HTTPS (browser traffic via domain name).
  server {
    listen 80;
    server_name test.pal.cmccfund.com;

    location /healthz {
      proxy_pass http://agenticx_gateway/healthz;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Internal HTTP: service-to-service load-balanced routing (accessed by IP).
  server {
    listen 80 default_server;
    server_name _;

    location /healthz {
      proxy_pass http://agenticx_gateway/healthz;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_pass http://agenticx_gateway;
    }

    location /api/internal/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_pass http://agenticx_admin;
    }

    location /api/chat/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
      proxy_pass http://agenticx_portal;
    }

    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://agenticx_admin/;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://agenticx_portal/;
    }
  }

  # Admin Console dedicated port: LB without path prefix requirement.
  # Access via http://192.168.16.66:3001/login directly.
  server {
    listen 3001;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://agenticx_admin;
    }
  }

  # Portal dedicated port: LB without path prefix requirement.
  # Access via http://192.168.16.66:3000/login directly.
  server {
    listen 3000;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
      proxy_pass http://agenticx_portal;
    }
  }

  server {
    listen 443 ssl http2;
    server_name test.pal.cmccfund.com;

    # The certificate must cover this server_name. The bundled _.cmccfund.com
    # certificate only covers *.cmccfund.com and does not cover test.pal.cmccfund.com.
    ssl_certificate     /etc/nginx/certs/_.cmccfund.com.pem;
    ssl_certificate_key /etc/nginx/certs/_.cmccfund.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Optional hardening; remove preload if you do not want HSTS preloading.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /healthz {
      proxy_pass http://agenticx_gateway/healthz;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
      limit_req zone=api_limit burst=60 nodelay;
      limit_conn api_conn 40;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_pass http://agenticx_gateway;
    }

    location /api/chat/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_pass http://agenticx_portal;
    }

    location /api/internal/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_pass http://agenticx_admin;
    }

    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://agenticx_admin/;
    }

    # Everything else, including /auth/desktop and /api/desktop/*, goes to web-portal.
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://agenticx_portal/;
    }
  }
}
