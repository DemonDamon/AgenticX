worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  # Raise header buffers to absorb larger auth cookies/JWT Set-Cookie responses.
  large_client_header_buffers 4 16k;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;

  # When Mobile Cloud SLB terminates TLS, it should forward
  # X-Forwarded-Proto=https to this edge nginx over HTTP.
  map $http_x_forwarded_proto $edge_forwarded_proto {
    default $scheme;
    ~*^https https;
    ~*^http http;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;

  upstream agenticx_gateway {
    least_conn;
    server 192.168.16.66:8088 max_fails=3 fail_timeout=10s;
    server 192.168.16.67:8088 max_fails=3 fail_timeout=10s;
  }

  upstream agenticx_portal {
    least_conn;
    server 192.168.16.68:3000 max_fails=3 fail_timeout=10s;
    server 192.168.16.69:3000 max_fails=3 fail_timeout=10s;
  }

  upstream agenticx_admin {
    least_conn;
    server 192.168.16.70:3001 max_fails=3 fail_timeout=10s;
    server 192.168.16.71:3001 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80;
    server_name _;

    location /healthz {
      proxy_pass http://agenticx_gateway/healthz;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
      limit_req zone=api_limit burst=60 nodelay;
      limit_conn api_conn 40;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_pass http://agenticx_gateway;
    }

    # portal BFF 独有：deep-research / web-search 编排 + 聊天历史。
    # gateway 只暴露 /v1/*，此处必须指向 portal，否则历史同步 404/连接重置。
    location /api/chat/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # SSE：禁用缓冲与缓存，否则事件被 nginx 攒着不下发。
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;

      # 与 orchestrator TOTAL_BUDGET_MS 对齐，留足余量。
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;

      proxy_pass http://agenticx_portal;
    }

    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://agenticx_admin/;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://agenticx_portal/;
    }
  }
}
