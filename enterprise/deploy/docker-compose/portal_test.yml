# Override fragment for HTTP test stacks.
# Usage: docker compose -f <base>.yml -f portal_test.yml up -d web-portal
services:
  web-portal:
    ports:
      - "3000:3000"
    environment:
      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXT_PUBLIC_GATEWAY_BASE: ${NEXT_PUBLIC_GATEWAY_BASE:?NEXT_PUBLIC_GATEWAY_BASE is required}
      GATEWAY_COMPLETIONS_URL: ${GATEWAY_COMPLETIONS_URL:?GATEWAY_COMPLETIONS_URL is required}
      NEXT_PUBLIC_ADMIN_CONSOLE_URL: ${NEXT_PUBLIC_ADMIN_CONSOLE_URL:?NEXT_PUBLIC_ADMIN_CONSOLE_URL is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-default}
    networks:
      - agenticx-backbone
