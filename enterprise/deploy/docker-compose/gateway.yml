services:
  gateway-a:
    ports:
      - "8088:8088"
    environment:
      GATEWAY_PORT: 8088
      DATABASE_DIALECT: mysql
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://192.168.16.66:6379/0
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      AGX_PROVIDER_SECRET_KEY: ${AGX_PROVIDER_SECRET_KEY}
      ADMIN_CONSOLE_SESSION_SECRET: ${ADMIN_CONSOLE_SESSION_SECRET}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?GATEWAY_INTERNAL_TOKEN is required}
      GATEWAY_REMOTE_PROVIDERS_URL: ${GATEWAY_REMOTE_PROVIDERS_URL:-http://192.168.16.70:3001/api/internal/providers}
      GATEWAY_REMOTE_CHANNELS_URL: ${GATEWAY_REMOTE_CHANNELS_URL:-http://192.168.16.70:3001/api/internal/channels}
      GATEWAY_REMOTE_PRICING_CONFIG_URL: ${GATEWAY_REMOTE_PRICING_CONFIG_URL:-http://192.168.16.70:3001/api/internal/pricing-snapshot}
      GATEWAY_REMOTE_MCP_SERVERS_URL: ${GATEWAY_REMOTE_MCP_SERVERS_URL:-http://192.168.16.70:3001/api/internal/mcp-servers-snapshot}
      GATEWAY_CHANNEL_REGISTRY: ${GATEWAY_CHANNEL_REGISTRY:-on}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-01J00000000000000000000001}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-01J00000000000000000000003}
