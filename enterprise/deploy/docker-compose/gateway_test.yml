# Override fragment for HTTP test stacks.
# Usage: docker compose -f <base>.yml -f gateway_test.yml up -d gateway-a gateway-b
services:
  gateway-a:
    ports:
      - "8088:8088"
    environment:
      GATEWAY_PORT: 8088
      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      AGX_PROVIDER_SECRET_KEY: ${AGX_PROVIDER_SECRET_KEY:?AGX_PROVIDER_SECRET_KEY is required}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?GATEWAY_INTERNAL_TOKEN is required}
      GATEWAY_REMOTE_PROVIDERS_URL: ${GATEWAY_REMOTE_PROVIDERS_URL:?GATEWAY_REMOTE_PROVIDERS_URL is required}
      GATEWAY_REMOTE_CHANNELS_URL: ${GATEWAY_REMOTE_CHANNELS_URL:?GATEWAY_REMOTE_CHANNELS_URL is required}
      GATEWAY_REMOTE_PRICING_CONFIG_URL: ${GATEWAY_REMOTE_PRICING_CONFIG_URL:?GATEWAY_REMOTE_PRICING_CONFIG_URL is required}
      GATEWAY_REMOTE_MCP_SERVERS_URL: ${GATEWAY_REMOTE_MCP_SERVERS_URL:?GATEWAY_REMOTE_MCP_SERVERS_URL is required}
      GATEWAY_CHANNEL_REGISTRY: ${GATEWAY_CHANNEL_REGISTRY:-on}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-default}
  gateway-b:
    ports:
      - "8089:8088"
    environment:
      GATEWAY_PORT: 8088
      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      AGX_PROVIDER_SECRET_KEY: ${AGX_PROVIDER_SECRET_KEY:?AGX_PROVIDER_SECRET_KEY is required}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?GATEWAY_INTERNAL_TOKEN is required}
      GATEWAY_REMOTE_PROVIDERS_URL: ${GATEWAY_REMOTE_PROVIDERS_URL:?GATEWAY_REMOTE_PROVIDERS_URL is required}
      GATEWAY_REMOTE_CHANNELS_URL: ${GATEWAY_REMOTE_CHANNELS_URL:?GATEWAY_REMOTE_CHANNELS_URL is required}
      GATEWAY_REMOTE_PRICING_CONFIG_URL: ${GATEWAY_REMOTE_PRICING_CONFIG_URL:?GATEWAY_REMOTE_PRICING_CONFIG_URL is required}
      GATEWAY_REMOTE_MCP_SERVERS_URL: ${GATEWAY_REMOTE_MCP_SERVERS_URL:?GATEWAY_REMOTE_MCP_SERVERS_URL is required}
      GATEWAY_CHANNEL_REGISTRY: ${GATEWAY_CHANNEL_REGISTRY:-on}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-default}
