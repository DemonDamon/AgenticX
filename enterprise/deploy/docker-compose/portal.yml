# Override fragment for portal runtime env (deep-research budget, attachments, etc.).
# Usage: docker compose -f <base>.yml -f portal.yml up -d web-portal
services:
  web-portal:
    ports:
      - "3000:3000"
    environment:
      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXT_PUBLIC_GATEWAY_BASE: ${NEXT_PUBLIC_GATEWAY_BASE:?NEXT_PUBLIC_GATEWAY_BASE is required}
      GATEWAY_COMPLETIONS_URL: ${GATEWAY_COMPLETIONS_URL:?GATEWAY_COMPLETIONS_URL is required}
      NEXT_PUBLIC_ADMIN_CONSOLE_URL: ${NEXT_PUBLIC_ADMIN_CONSOLE_URL:?NEXT_PUBLIC_ADMIN_CONSOLE_URL is required}
      WEB_PORTAL_PUBLIC_BASE_URL: ${WEB_PORTAL_PUBLIC_BASE_URL:-}
      AGX_PROVIDER_SECRET_KEY: ${AGX_PROVIDER_SECRET_KEY:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-default}
      ATTACHMENT_BLOB_DIR: /runtime/attachments
      AGX_CLARIFY_WAIT_DIR: /runtime/deep-research-clarify
      # 若入口代理读超时 < 20min，按其数值收紧（留 2min 余量）
      # DEEP_RESEARCH_TOTAL_BUDGET_MS: "900000"
    volumes:
      - web_portal_runtime:/runtime
    networks:
      - agenticx-backbone

volumes:
  web_portal_runtime:
