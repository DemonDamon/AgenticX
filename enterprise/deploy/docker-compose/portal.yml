services:
  web-portal:
    ports:
      - "3000:3000"
    environment:
      DATABASE_DIALECT: mysql
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_GATEWAY_BASE: http://192.168.16.66
      GATEWAY_COMPLETIONS_URL: ${GATEWAY_COMPLETIONS_URL:-http://192.168.16.66:8088/v1/chat/completions}
      NEXT_PUBLIC_ADMIN_CONSOLE_URL: ${NEXT_PUBLIC_ADMIN_CONSOLE_URL:-http://192.168.16.70:3001}
      AGX_PROVIDER_SECRET_KEY: ${AGX_PROVIDER_SECRET_KEY}
      AUTH_COOKIE_SECURE: "false"
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-01J00000000000000000000001}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-01J00000000000000000000003}
      ATTACHMENT_BLOB_DIR: /runtime/attachments
      AGX_CLARIFY_WAIT_DIR: /runtime/deep-research-clarify
    volumes:
      - web_portal_runtime:/runtime
    networks:
      - agenticx-backbone

volumes:
  web_portal_runtime:
