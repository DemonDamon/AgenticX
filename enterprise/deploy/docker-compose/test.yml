# Compact single-gateway test stack (HTTP-friendly via AUTH_COOKIE_SECURE).
# Prefer sourcing a local env file derived from load-test-runtime-env.sh first.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: agenticx-nginx-test
    restart: unless-stopped
    depends_on:
      gateway-a:
        condition: service_started
      web-portal:
        condition: service_started
      admin-console:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/gateway.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    networks:
      - agenticx-backbone

  gateway-a:
    image: ghcr.io/agenticx/enterprise-gateway:latest
    container_name: agenticx-gateway-a
    restart: unless-stopped
    # Gateway test stack writes audit files under /runtime/audit on a shared volume.
    # Run as root here so first boot can create runtime directories without manual chown.
    user: "0:0"
    environment:
      GATEWAY_PORT: 8088
      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-default}
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      GATEWAY_CONFIG_PATH: /app/config/policies.yaml
      GATEWAY_QUOTA_CONFIG_FILE: /runtime/admin/quotas.json
      GATEWAY_QUOTA_USAGE_FILE: /runtime/gateway/quota-usage.json
      GATEWAY_POLICY_SNAPSHOT_FILE: /runtime/admin/policy-snapshot.json
      GATEWAY_POLICY_OVERRIDE_FILE: /runtime/admin/policy-overrides.json
    volumes:
      - gateway_runtime:/runtime
      - ../config/policies.yaml:/app/config/policies.yaml:ro
      - ../../plugins:/app/plugins:ro
    networks:
      - agenticx-backbone

  web-portal:
    image: ghcr.io/agenticx/enterprise-web-portal:latest
    container_name: agenticx-web-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXT_PUBLIC_GATEWAY_BASE: ${NEXT_PUBLIC_GATEWAY_BASE:-http://nginx}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-default}
    networks:
      - agenticx-backbone

  admin-console:
    image: ghcr.io/agenticx/enterprise-admin-console:latest
    container_name: agenticx-admin-console
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://gateway-a:8088}
      AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      ADMIN_CONSOLE_LOGIN_PASSWORD: ${ADMIN_CONSOLE_LOGIN_PASSWORD:?ADMIN_CONSOLE_LOGIN_PASSWORD is required}
      ADMIN_CONSOLE_SESSION_SECRET: ${ADMIN_CONSOLE_SESSION_SECRET:?ADMIN_CONSOLE_SESSION_SECRET is required}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
      DEFAULT_DEPT_ID: ${DEFAULT_DEPT_ID:-default}
      ENTERPRISE_ADMIN_RUNTIME_DIR: /runtime/admin
      ENTERPRISE_QUOTA_CONFIG_FILE: /runtime/admin/quotas.json
      ENTERPRISE_POLICY_SNAPSHOT_FILE: /runtime/admin/policy-snapshot.json
      ENTERPRISE_POLICY_OVERRIDE_FILE: /runtime/admin/policy-overrides.json
    volumes:
      - gateway_runtime:/runtime
      - ../../plugins:/app/plugins:ro
    networks:
      - agenticx-backbone

  redis:
    image: redis:7-alpine
    container_name: agenticx-redis-test
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1", "300", "10"]
    volumes:
      - redis_data:/data
    networks:
      - agenticx-backbone

networks:
  agenticx-backbone:
    driver: bridge

volumes:
  gateway_runtime:
  redis_data:
