<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阳光盒 · 正方体</title>
  <style>
    :root {
      --sun: #ff7a45;
      --paper: #ffffff;
      --ink: #161513;
      --mute: #6d675d;
      --line: #e8e4dc;
      --disk: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
    body {
      font: 14px/1.5 "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 56px;
      gap: 28px;
    }
    .disk {
      width: min(420px, 78vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }
    .disk svg {
      width: 72%;
      height: 72%;
      overflow: visible;
      color-scheme: light;
      --bg: #fff;
      --fg: #ff7a45;
      --disk: #fff;
    }
    .meta { text-align: center; }
    .meta h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .meta p { margin: 0; color: var(--mute); font-size: 12px; }
    .swatch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--mute);
      font-size: 12px;
    }
    .swatch i {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--sun);
    }
    .moods {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 520px;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      background: var(--sun);
      border-color: var(--sun);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="disk">
      <svg id="bot" role="img" aria-label="正方体"></svg>
    </div>
    <div class="meta">
      <h1>正方体</h1>
      <p>原角色引擎 · 身形 squircle · 颜色 #FF7A45</p>
      <div class="swatch"><i></i>#FF7A45</div>
    </div>
    <div class="moods" id="moods">
      <button type="button" data-state="curious">好奇</button>
      <button type="button" data-state="proud" aria-pressed="true">得意</button>
      <button type="button" data-state="happy">高兴</button>
      <button type="button" data-state="laughing">大笑</button>
      <button type="button" data-state="listening">倾听</button>
      <button type="button" data-state="excited">兴奋</button>
      <button type="button" data-state="surprised">惊讶</button>
      <button type="button" data-state="sleeping">休息</button>
    </div>
  </div>

  <script src="engine/geometry-data.js"></script>
  <script src="engine/src/math.js"></script>
  <script src="engine/src/tables.js"></script>
  <script src="engine/src/pose.js"></script>
  <script src="engine/src/tricks.js"></script>
  <script src="engine/src/fx.js"></script>
  <script src="engine/src/eyes.js"></script>
  <script src="engine/src/character.js"></script>
  <script>
    const bot = new GrokCharacter(document.getElementById("bot"), {
      shape: "squircle",
      color: "orange",
      scheme: "light",
      loginWrap: true,
      followPointer: true,
      inkFlat: "#FF7A45",
      eyeColor: "#ffffff",
      mode: "hold",
      state: "proud",
    });
    bot.setInk("#FF7A45");
    bot.setShape("squircle");
    bot.setState("proud", { resetEyes: true });

    document.getElementById("moods").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-state]");
      if (!btn) return;
      bot.setMode("hold");
      bot.setState(btn.dataset.state, { resetEyes: false });
      for (const node of event.currentTarget.querySelectorAll("button")) {
        node.setAttribute("aria-pressed", String(node === btn));
      }
    });
  </script>
</body>
</html>
