computes:
  - id: tag_status_active
    type: equals_const
    field: status
    value: active
  - id: tag_channel_copy
    type: copy_field
    field: channel
  - id: tag_premium
    type: in_set
    field: tier
    values: [gold, platinum]
  - id: tag_ready
    type: bool_and
    fields: [member_id, status]
