<svg xmlns="http://www.w3.org/2000/svg" width="960" height="922" viewBox="0 0 960 922" role="img" aria-labelledby="title desc"><title id="title">自托管 Environment 执行内置工具</title><desc id="desc">参与方之间按时间顺序传递会话事件</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#31536f"/></marker></defs><rect width="960" height="922" fill="#ffffff"/><rect x="26" y="12" width="148" height="40" rx="4" fill="#f4f7f9" stroke="#91a4b3"/><text x="100" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#172b3a">业务应用</text><line x1="100" y1="52" x2="100" y2="904" stroke="#aab7c2" stroke-width="1" stroke-dasharray="4 5"/><rect x="279" y="12" width="148" height="40" rx="4" fill="#f4f7f9" stroke="#91a4b3"/><text x="353" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#172b3a">方舟服务端</text><line x1="353" y1="52" x2="353" y2="904" stroke="#aab7c2" stroke-width="1" stroke-dasharray="4 5"/><rect x="533" y="12" width="148" height="40" rx="4" fill="#f4f7f9" stroke="#91a4b3"/><text x="607" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#172b3a">自托管 Worker</text><line x1="607" y1="52" x2="607" y2="904" stroke="#aab7c2" stroke-width="1" stroke-dasharray="4 5"/><rect x="786" y="12" width="148" height="40" rx="4" fill="#f4f7f9" stroke="#91a4b3"/><text x="860" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#172b3a">企业 Sandbox</text><line x1="860" y1="52" x2="860" y2="904" stroke="#aab7c2" stroke-width="1" stroke-dasharray="4 5"/><text x="226.5" y="95" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">1. 建立业务 SSE · 等待服务端就绪</text><line x1="108" y1="106" x2="345" y2="106" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="226.5" y="161" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">2. user.message · 提交任务</text><line x1="108" y1="172" x2="345" y2="172" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="480" y="227" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">3. Poll / Acknowledge Work · 认领 Work</text><line x1="599" y1="238" x2="361" y2="238" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="226.5" y="293" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">4. session.status_running · 开始处理</text><line x1="345" y1="304" x2="108" y2="304" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="480" y="359" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">5. 建立 Worker SSE · 订阅工具事件</text><line x1="599" y1="370" x2="361" y2="370" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="480" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">6. agent.tool_use · 下发工具调用</text><line x1="361" y1="436" x2="599" y2="436" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="733.5" y="491" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">7. 执行工具 · 运行本地操作</text><line x1="615" y1="502" x2="852" y2="502" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="733.5" y="557" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">8. 返回执行结果 · 完成本地操作</text><line x1="852" y1="568" x2="615" y2="568" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="480" y="623" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">9. user.tool_result · 回传工具结果</text><line x1="599" y1="634" x2="361" y2="634" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="226.5" y="689" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">10. agent.tool_result · 返回结果事件</text><line x1="345" y1="700" x2="108" y2="700" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="226.5" y="755" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">11. agent.message · 返回最终回复</text><line x1="345" y1="766" x2="108" y2="766" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="226.5" y="821" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">12. session.status_idle · 结束当前轮次</text><line x1="345" y1="832" x2="108" y2="832" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/></svg>