<svg xmlns="http://www.w3.org/2000/svg" width="720" height="724" viewBox="0 0 720 724" role="img" aria-labelledby="title desc"><title id="title">业务应用执行 Custom Tool</title><desc id="desc">参与方之间按时间顺序传递会话事件</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#31536f"/></marker></defs><rect width="720" height="724" fill="#ffffff"/><rect x="26" y="12" width="148" height="40" rx="4" fill="#f4f7f9" stroke="#91a4b3"/><text x="100" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#172b3a">业务应用</text><line x1="100" y1="52" x2="100" y2="706" stroke="#aab7c2" stroke-width="1" stroke-dasharray="4 5"/><rect x="546" y="12" width="148" height="40" rx="4" fill="#f4f7f9" stroke="#91a4b3"/><text x="620" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#172b3a">方舟服务端</text><line x1="620" y1="52" x2="620" y2="706" stroke="#aab7c2" stroke-width="1" stroke-dasharray="4 5"/><text x="360" y="95" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">1. 建立 SSE 连接 · 等待服务端就绪</text><line x1="108" y1="106" x2="612" y2="106" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="360" y="161" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">2. user.message · 提交任务</text><line x1="108" y1="172" x2="612" y2="172" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="360" y="227" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">3. session.status_running · 开始处理</text><line x1="612" y1="238" x2="108" y2="238" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="360" y="293" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">4. agent.custom_tool_use · 请求执行工具</text><line x1="612" y1="304" x2="108" y2="304" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="360" y="359" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">5. session.status_idle · 等待工具结果</text><line x1="612" y1="370" x2="108" y2="370" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="360" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">6. user.custom_tool_result · 回传执行结果</text><line x1="108" y1="436" x2="612" y2="436" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="360" y="491" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">7. session.status_running · 恢复执行</text><line x1="612" y1="502" x2="108" y2="502" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="360" y="557" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">8. agent.message · 返回最终回复</text><line x1="612" y1="568" x2="108" y2="568" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="360" y="623" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#24465f">9. session.status_idle · 结束当前轮次</text><line x1="612" y1="634" x2="108" y2="634" stroke="#31536f" stroke-width="1.6" marker-end="url(#arrow)"/></svg>